name: Build and Deploy .NET 10 MVC App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Publish Application
      run: |
        dotnet publish -c Release -f net10.0 -r win-x64 --self-contained false -o ./publish
        
    - name: Sync Files to FTP Server (with TLS)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /Prg6-VisorErrores/Produccion/
        protocol: ftps              
        port: 21
        security: loose
